spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/v1/auth/**
          filters:
            - RewritePath=/v1/auth/(?<segment>.*), /auth/${segment}
        - id: wallet-service
          uri: lb://wallet-service
          predicates:
            - Path=/v1/wallet/**
          filters:
            - StripPrefix=1
        - id: transfer-service
          uri: lb://transfer-service
          predicates:
            - Path=/v1/transfer/**
          filters:
            - StripPrefix=1
        - id: merchant-service
          uri: lb://merchant-service
          predicates:
            - Path=/v1/merchant/**
          filters:
            - StripPrefix=1
        - id: merchant-service-merchants
          uri: lb://merchant-service
          predicates:
            - Path=/v1/merchants/**
          filters:
            - StripPrefix=1
        - id: bill-payment-service
          uri: lb://bill-payment-service
          predicates:
            - Path=/v1/bills/**
          filters:
            - StripPrefix=1
        - id: airtime-service
          uri: lb://bill-payment-service
          predicates:
            - Path=/v1/airtime/**
          filters:
            - StripPrefix=1
        - id: agent-service
          uri: lb://agent-service
          predicates:
            - Path=/v1/agent/**
          filters:
            - StripPrefix=1
        - id: corporate-service
          uri: lb://corporate-service
          predicates:
            - Path=/v1/corp/**
          filters:
            - StripPrefix=1
        - id: settlement-service
          uri: lb://settlement-service
          predicates:
            - Path=/v1/settlements/**
          filters:
            - StripPrefix=1
        - id: dispute-service
          uri: lb://dispute-service
          predicates:
            - Path=/v1/disputes/**
          filters:
            - StripPrefix=1
        - id: audit-service
          uri: lb://audit-service
          predicates:
            - Path=/v1/audit/**
          filters:
            - StripPrefix=1
        - id: admin-kyc
          uri: lb://kyc-service
          predicates:
            - Path=/v1/admin/kyc/**
          filters:
            - StripPrefix=1
        - id: admin-aml
          uri: lb://fraud-risk-service
          predicates:
            - Path=/v1/admin/aml/**
          filters:
            - StripPrefix=1
        - id: admin-users
          uri: lb://auth-service
          predicates:
            - Path=/v1/admin/users/**
          filters:
            - StripPrefix=1
        - id: admin-merchants
          uri: lb://merchant-service
          predicates:
            - Path=/v1/admin/merchants/**
          filters:
            - StripPrefix=1
        - id: reporting-service
          uri: lb://reporting-service
          predicates:
            - Path=/v1/admin/**
          filters:
            - StripPrefix=1
        - id: kyc-service
          uri: lb://kyc-service
          predicates:
            - Path=/v1/kyc/**
          filters:
            - StripPrefix=1
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/v1/notifications/**
          filters:
            - StripPrefix=1
        - id: fraud-risk-service
          uri: lb://fraud-risk-service
          predicates:
            - Path=/v1/fraud/**
          filters:
            - StripPrefix=1
        - id: remittance-service
          uri: lb://remittance-service
          predicates:
            - Path=/v1/remittance/**
          filters:
            - StripPrefix=1
        - id: promotions-service
          uri: lb://promotions-service
          predicates:
            - Path=/v1/promotions/**
          filters:
            - StripPrefix=1
        - id: support-service
          uri: lb://support-service
          predicates:
            - Path=/v1/support/**
          filters:
            - StripPrefix=1
        - id: reference-data-service
          uri: lb://reference-data-service
          predicates:
            - Path=/v1/refdata/**
          filters:
            - StripPrefix=1
        - id: wallet-service-savings
          uri: lb://wallet-service
          predicates:
            - Path=/v1/savings/**
          filters:
            - RewritePath=/v1/savings/(?<segment>.*), /wallet/savings/${segment}
        - id: merchant-service-staff
          uri: lb://merchant-service
          predicates:
            - Path=/v1/staff/**
          filters:
            - StripPrefix=1
        - id: merchant-service-directory
          uri: lb://merchant-service
          predicates:
            - Path=/v1/directory/**
          filters:
            - RewritePath=/v1/directory/(?<segment>.*), /merchants/directory/${segment}
        - id: merchant-service-invoices
          uri: lb://merchant-service
          predicates:
            - Path=/v1/invoices/**
          filters:
            - RewritePath=/v1/invoices(?<segment>.*), /merchant/invoices${segment}
        - id: merchant-service-payment-links
          uri: lb://merchant-service
          predicates:
            - Path=/v1/payment-links/**
          filters:
            - StripPrefix=1
        - id: transfer-service-schedule
          uri: lb://transfer-service
          predicates:
            - Path=/v1/scheduled/**
          filters:
            - RewritePath=/v1/scheduled/(?<segment>.*), /transfer/schedule/${segment}
        - id: transfer-service-request-create
          uri: lb://transfer-service
          predicates:
            - Path=/v1/request-money
          filters:
            - RewritePath=/v1/request-money, /transfer/request
        - id: transfer-service-request
          uri: lb://transfer-service
          predicates:
            - Path=/v1/request-money/**
          filters:
            - RewritePath=/v1/request-money/(?<segment>.*), /transfer/request/${segment}
        - id: corporate-service-payroll
          uri: lb://corporate-service
          predicates:
            - Path=/v1/payroll/**
          filters:
            - RewritePath=/v1/payroll/(?<segment>.*), /corp/payroll/${segment}
        - id: swagger-proxy-auth-service
          uri: lb://auth-service
          predicates:
            - Path=/swagger-proxy/auth-service/**
          filters:
            - RewritePath=/swagger-proxy/auth-service/(?<segment>.*), /${segment}
        - id: swagger-proxy-wallet-service
          uri: lb://wallet-service
          predicates:
            - Path=/swagger-proxy/wallet-service/**
          filters:
            - RewritePath=/swagger-proxy/wallet-service/(?<segment>.*), /${segment}
        - id: swagger-proxy-transfer-service
          uri: lb://transfer-service
          predicates:
            - Path=/swagger-proxy/transfer-service/**
          filters:
            - RewritePath=/swagger-proxy/transfer-service/(?<segment>.*), /${segment}
        - id: swagger-proxy-merchant-service
          uri: lb://merchant-service
          predicates:
            - Path=/swagger-proxy/merchant-service/**
          filters:
            - RewritePath=/swagger-proxy/merchant-service/(?<segment>.*), /${segment}
        - id: swagger-proxy-bill-payment-service
          uri: lb://bill-payment-service
          predicates:
            - Path=/swagger-proxy/bill-payment-service/**
          filters:
            - RewritePath=/swagger-proxy/bill-payment-service/(?<segment>.*), /${segment}
        - id: swagger-proxy-agent-service
          uri: lb://agent-service
          predicates:
            - Path=/swagger-proxy/agent-service/**
          filters:
            - RewritePath=/swagger-proxy/agent-service/(?<segment>.*), /${segment}
        - id: swagger-proxy-corporate-service
          uri: lb://corporate-service
          predicates:
            - Path=/swagger-proxy/corporate-service/**
          filters:
            - RewritePath=/swagger-proxy/corporate-service/(?<segment>.*), /${segment}
        - id: swagger-proxy-fraud-risk-service
          uri: lb://fraud-risk-service
          predicates:
            - Path=/swagger-proxy/fraud-risk-service/**
          filters:
            - RewritePath=/swagger-proxy/fraud-risk-service/(?<segment>.*), /${segment}
        - id: swagger-proxy-settlement-service
          uri: lb://settlement-service
          predicates:
            - Path=/swagger-proxy/settlement-service/**
          filters:
            - RewritePath=/swagger-proxy/settlement-service/(?<segment>.*), /${segment}
        - id: swagger-proxy-dispute-service
          uri: lb://dispute-service
          predicates:
            - Path=/swagger-proxy/dispute-service/**
          filters:
            - RewritePath=/swagger-proxy/dispute-service/(?<segment>.*), /${segment}
        - id: swagger-proxy-reporting-service
          uri: lb://reporting-service
          predicates:
            - Path=/swagger-proxy/reporting-service/**
          filters:
            - RewritePath=/swagger-proxy/reporting-service/(?<segment>.*), /${segment}
        - id: swagger-proxy-kyc-service
          uri: lb://kyc-service
          predicates:
            - Path=/swagger-proxy/kyc-service/**
          filters:
            - RewritePath=/swagger-proxy/kyc-service/(?<segment>.*), /${segment}
        - id: swagger-proxy-audit-service
          uri: lb://audit-service
          predicates:
            - Path=/swagger-proxy/audit-service/**
          filters:
            - RewritePath=/swagger-proxy/audit-service/(?<segment>.*), /${segment}
        - id: swagger-proxy-remittance-service
          uri: lb://remittance-service
          predicates:
            - Path=/swagger-proxy/remittance-service/**
          filters:
            - RewritePath=/swagger-proxy/remittance-service/(?<segment>.*), /${segment}
        - id: swagger-proxy-promotions-service
          uri: lb://promotions-service
          predicates:
            - Path=/swagger-proxy/promotions-service/**
          filters:
            - RewritePath=/swagger-proxy/promotions-service/(?<segment>.*), /${segment}
        - id: swagger-proxy-support-service
          uri: lb://support-service
          predicates:
            - Path=/swagger-proxy/support-service/**
          filters:
            - RewritePath=/swagger-proxy/support-service/(?<segment>.*), /${segment}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: auth-service
        url: /swagger-proxy/auth-service/api-docs
      - name: wallet-service
        url: /swagger-proxy/wallet-service/api-docs
      - name: transfer-service
        url: /swagger-proxy/transfer-service/api-docs
      - name: merchant-service
        url: /swagger-proxy/merchant-service/api-docs
      - name: bill-payment-service
        url: /swagger-proxy/bill-payment-service/api-docs
      - name: agent-service
        url: /swagger-proxy/agent-service/api-docs
      - name: corporate-service
        url: /swagger-proxy/corporate-service/api-docs
      - name: fraud-risk-service
        url: /swagger-proxy/fraud-risk-service/api-docs
      - name: settlement-service
        url: /swagger-proxy/settlement-service/api-docs
      - name: dispute-service
        url: /swagger-proxy/dispute-service/api-docs
      - name: reporting-service
        url: /swagger-proxy/reporting-service/api-docs
      - name: kyc-service
        url: /swagger-proxy/kyc-service/api-docs
      - name: audit-service
        url: /swagger-proxy/audit-service/api-docs
      - name: remittance-service
        url: /swagger-proxy/remittance-service/api-docs
      - name: promotions-service
        url: /swagger-proxy/promotions-service/api-docs
      - name: support-service
        url: /swagger-proxy/support-service/api-docs

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-change-in-production}

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
