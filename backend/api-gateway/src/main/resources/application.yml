spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/v1/auth/**
          filters:
            - RewritePath=/v1/auth/(?<segment>.*), /auth/${segment}
        - id: wallet-service
          uri: lb://wallet-service
          predicates:
            - Path=/v1/wallet/**
        - id: transfer-service
          uri: lb://transfer-service
          predicates:
            - Path=/v1/transfer/**
        - id: merchant-service
          uri: lb://merchant-service
          predicates:
            - Path=/v1/merchant/**
            - Path=/v1/merchants/**
        - id: bill-payment-service
          uri: lb://bill-payment-service
          predicates:
            - Path=/v1/bills/**
            - Path=/v1/airtime/**
        - id: agent-service
          uri: lb://agent-service
          predicates:
            - Path=/v1/agent/**
        - id: corporate-service
          uri: lb://corporate-service
          predicates:
            - Path=/v1/corp/**
        - id: settlement-service
          uri: lb://settlement-service
          predicates:
            - Path=/v1/settlements/**
        - id: dispute-service
          uri: lb://dispute-service
          predicates:
            - Path=/v1/disputes/**
        - id: audit-service
          uri: lb://audit-service
          predicates:
            - Path=/v1/audit/**
        - id: reporting-service
          uri: lb://reporting-service
          predicates:
            - Path=/v1/admin/**
        - id: kyc-service
          uri: lb://kyc-service
          predicates:
            - Path=/v1/kyc/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/v1/notifications/**
        - id: fraud-risk-service
          uri: lb://fraud-risk-service
          predicates:
            - Path=/v1/fraud/**
        - id: remittance-service
          uri: lb://remittance-service
          predicates:
            - Path=/v1/remittance/**
        - id: promotions-service
          uri: lb://promotions-service
          predicates:
            - Path=/v1/promotions/**
        - id: support-service
          uri: lb://support-service
          predicates:
            - Path=/v1/support/**
        - id: wallet-service-savings
          uri: lb://wallet-service
          predicates:
            - Path=/v1/savings/**
          filters:
            - RewritePath=/v1/savings/(?<segment>.*), /wallet/savings/${segment}
        - id: merchant-service-staff
          uri: lb://merchant-service
          predicates:
            - Path=/v1/staff/**
          filters:
            - RewritePath=/v1/staff/(?<segment>.*), /merchant/staff/${segment}
        - id: merchant-service-directory
          uri: lb://merchant-service
          predicates:
            - Path=/v1/directory/**
          filters:
            - RewritePath=/v1/directory/(?<segment>.*), /merchants/directory/${segment}
        - id: merchant-service-invoices
          uri: lb://merchant-service
          predicates:
            - Path=/v1/invoices/**
          filters:
            - RewritePath=/v1/invoices/(?<segment>.*), /merchant/invoices/${segment}
        - id: transfer-service-schedule
          uri: lb://transfer-service
          predicates:
            - Path=/v1/scheduled/**
          filters:
            - RewritePath=/v1/scheduled/(?<segment>.*), /transfer/schedule/${segment}
        - id: transfer-service-request
          uri: lb://transfer-service
          predicates:
            - Path=/v1/request-money/**
          filters:
            - RewritePath=/v1/request-money/(?<segment>.*), /transfer/request/${segment}
        - id: corporate-service-payroll
          uri: lb://corporate-service
          predicates:
            - Path=/v1/payroll/**
          filters:
            - RewritePath=/v1/payroll/(?<segment>.*), /corp/payroll/${segment}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-change-in-production}

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
